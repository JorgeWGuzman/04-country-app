<section class="mt-5">
  <table class="table table-md mt-2 w-full">
    <thead>
      <tr>
        <th>#</th>
        <th>Ícono</th>
        <th>Bandera</th>
        <th>Nombre</th>
        <th>Capital</th>
        <th>Población</th>
        <th></th>
      </tr>
    </thead>
    <tbody>
      @for (country of countries(); track $index) {

      <tr>
        <td>{{ $index + 1 }}</td>
        <td>{{ country.flag.emoji }}</td>
        <td>
          <img [src]="country.flag.url_png" width="40">
        </td>
        <td>{{ country.names.common }}</td>
        <td>{{ country.capitals[0]?.name }}</td>
        <td>{{ country.population }}</td>
        <td>-</td>
      </tr>
}
    </tbody>
  </table>
</section>
