<country-search-input
  placeholder="Buscar por capital"
  [initialValue]="query()"
  (value)="query.set($event)"
/>

<country-list
  [countries]="countryResource.value()"
  [errorMessage]="countryResource.error() ? 'No se encontró ningún resultado para la búsqueda' : null"
  [isloading]="countryResource.isLoading()"
  [query]="query()"
  (onReset)="query.set('')"
/>
